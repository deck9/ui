name: Publish on NPM Registry
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no token secret
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # no cache in the release build
      - run: npm ci
      - run: npm run build
      - name: Publish, prereleases under the next tag
        run: |
          case "$(node -p 'require("./package.json").version')" in
            *-*) npm publish --tag next ;; # e.g. 0.16.0-next.0, latest stays on the last final release
            *) npm publish ;;
          esac
