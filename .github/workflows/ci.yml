name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Check that main, module, types and exports are in the package
        run: |
          npm pack --dry-run --json | node -e '
            const pkg = require("./package.json");
            const packed = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((file) => file.path);
            const targets = (value, name) => typeof value === "string" ? [[name, value]] : Object.entries(value).flatMap(([key, inner]) => targets(inner, `${name}["${key}"]`));
            const fields = [["main", pkg.main], ["module", pkg.module], ["types", pkg.types], ...targets(pkg.exports, "exports")];
            const missing = fields.filter(([, file]) => !packed.includes(require("path").normalize(file)));
            if (missing.length) {
              console.error(`Not in the package: ${missing.map(([field, file]) => `${field} ${file}`).join(", ")}`);
              process.exit(1);
            }
          '
      - name: Check that the type files in dist type-check
        run: npx tsc -p tsconfig.dist.json
